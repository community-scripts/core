name: Verify split files

# lib/tools.func, ui/build-ui.func and api/api.func are loaders whose
# implementations sit beside them. A split can silently lose a function -- most
# easily by cutting through a heredoc that contains a column-0 function
# definition, which looks like a definition but is payload. That only surfaces
# on a user's host at install time, so it is checked here instead.
#
# The same applies to the prefetch lists in core/build.func and
# lxc/install.func: a .func missing from one still works, it just costs a round
# trip nobody would notice. So they are checked, not trusted.

on:
  pull_request:
    paths:
      - "core/**"
      - "lxc/**"
      - "host/**"
      - "api/**"
      - "lib/**"
      - "ui/**"
      - "vm/**"
      - "pve/**"
      - "incus/**"
      - "tests/vm-iso-storage.sh"
      - "tests/vm-consoles.sh"
      - "tests/vm-helpers.sh"
      - "tests/vm-host-limits.sh"
      - "tests/mongodb-upgrade.sh"
      - "tests/uv-required-version.sh"
      - "tests/docker-lxcfs.sh"
      - "tests/java-memory.sh"
      - "tests/sudo-env.sh"
      - "tests/deb822-local-keyring.sh"
      - "tests/gpu-pci-class.sh"
      - "tests/nvidia-version-pin.sh"
      - "tests/external-installer.sh"
      - "tests/forge-version-key.sh"
      - "tests/nodejs-key-refresh.sh"
      - "tests/nodejs-in-place.sh"
      - "tests/nodejs-npm-restore.sh"
      - "tests/forge-connection.sh"
      - "tests/failed-command-output.sh"
      - "tests/stale-silent-record.sh"
      - "tests/tool-run-log.sh"
      - "tests/exit-code-hints.sh"
      - "tests/telemetry-trace.sh"
      - "tests/host-probes.sh"
      - "tests/forge-release-json.sh"
      - "tests/install-cleanup.sh"
      - "tests/console-hangup.sh"
      - "tests/setup-step-failures.sh"
      - "tests/pct-create-settings.sh"
      - "tests/container-removal-offer.sh"
      - "tests/incus-restricted-project.sh"
      - "tests/incus-target.sh"
      - "tests/incus-storage-space.sh"
      - "tests/release-stamp-pending.sh"
      - "tests/pct-start-reason.sh"
      - "tests/vm-silent.sh"
      - "tests/vm-failure-reasons.sh"
      - "tests/silent-verbose.sh"
      - "tests/github-release-noapi.sh"
      - "tests/vm-dialog-esc.sh"
      - "tests/forge-clean-install.sh"
      - "tests/cs-clear.sh"
      - "tests/forge-appversion-scope.sh"
      - "tests/motd-os-version.sh"
      - "tests/gpg-key-reason.sh"
      - "tests/forge-branch-clean-install.sh"
      - "tests/alpine-clean-install.sh"
      - "tests/app-vars-files.sh"
      - ".github/workflows/verify-split-files.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "lxc/**"
      - "host/**"
      - "api/**"
      - "lib/**"
      - "ui/**"
      - "vm/**"
      - "pve/**"
      - "incus/**"
      - "tests/vm-iso-storage.sh"
      - "tests/vm-consoles.sh"
      - "tests/vm-helpers.sh"
      - "tests/vm-host-limits.sh"
      - "tests/mongodb-upgrade.sh"
      - "tests/uv-required-version.sh"
      - "tests/docker-lxcfs.sh"
      - "tests/java-memory.sh"
      - "tests/sudo-env.sh"
      - "tests/deb822-local-keyring.sh"
      - "tests/gpu-pci-class.sh"
      - "tests/nvidia-version-pin.sh"
      - "tests/external-installer.sh"
      - "tests/forge-version-key.sh"
      - "tests/nodejs-key-refresh.sh"
      - "tests/nodejs-in-place.sh"
      - "tests/nodejs-npm-restore.sh"
      - "tests/forge-connection.sh"
      - "tests/failed-command-output.sh"
      - "tests/stale-silent-record.sh"
      - "tests/tool-run-log.sh"
      - "tests/exit-code-hints.sh"
      - "tests/telemetry-trace.sh"
      - "tests/host-probes.sh"
      - "tests/forge-release-json.sh"
      - "tests/install-cleanup.sh"
      - "tests/console-hangup.sh"
      - "tests/setup-step-failures.sh"
      - "tests/pct-create-settings.sh"
      - "tests/container-removal-offer.sh"
      - "tests/incus-restricted-project.sh"
      - "tests/incus-target.sh"
      - "tests/incus-storage-space.sh"
      - "tests/release-stamp-pending.sh"
      - "tests/pct-start-reason.sh"
      - "tests/vm-silent.sh"
      - "tests/vm-failure-reasons.sh"
      - "tests/silent-verbose.sh"
      - "tests/github-release-noapi.sh"
      - "tests/vm-dialog-esc.sh"
      - "tests/forge-clean-install.sh"
      - "tests/cs-clear.sh"
      - "tests/forge-appversion-scope.sh"
      - "tests/motd-os-version.sh"
      - "tests/gpg-key-reason.sh"
      - "tests/forge-branch-clean-install.sh"
      - "tests/alpine-clean-install.sh"
      - "tests/app-vars-files.sh"
      - ".github/workflows/verify-split-files.yml"
  workflow_dispatch:

env:
  ENGINE_DIRS: core lxc host api lib ui vm pve incus

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every part parses
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(find $ENGINE_DIRS -name '*.func' -type f)
          exit $fail

      - name: ISO storage regression tests
        run: bash tests/vm-iso-storage.sh

      - name: VM console regression tests
        run: bash tests/vm-consoles.sh

      - name: VM helper regression tests
        run: bash tests/vm-helpers.sh

      - name: VM host limit tests
        run: bash tests/vm-host-limits.sh

      - name: MongoDB upgrade regression tests
        run: bash tests/mongodb-upgrade.sh

      - name: uv pin regression tests
        run: bash tests/uv-required-version.sh

      - name: Docker lxcfs visibility regression tests
        run: bash tests/docker-lxcfs.sh

      - name: Java memory drop-in tests
        run: bash tests/java-memory.sh

      - name: sudo environment tests
        run: bash tests/sudo-env.sh

      - name: deb822 local keyring tests
        run: bash tests/deb822-local-keyring.sh

      - name: GPU detection by PCI class tests
        run: bash tests/gpu-pci-class.sh

      - name: NVIDIA userspace version pin tests
        run: bash tests/nvidia-version-pin.sh

      - name: External installer confirmation tests
        run: bash tests/external-installer.sh

      - name: Forge version key regression tests
        run: bash tests/forge-version-key.sh

      - name: Node.js key refresh tests
        run: bash tests/nodejs-key-refresh.sh

      - name: Node.js in-place upgrade tests
        run: bash tests/nodejs-in-place.sh

      - name: Node.js npm restore tests
        run: bash tests/nodejs-npm-restore.sh

      - name: Forge connection diagnosis tests
        run: bash tests/forge-connection.sh

      - name: Failed command output tests
        run: bash tests/failed-command-output.sh
      - name: Stale silent record tests
        run: bash tests/stale-silent-record.sh
      - name: Tool run log tests
        run: bash tests/tool-run-log.sh

      - name: Exit code hint tests
        run: bash tests/exit-code-hints.sh

      - name: Telemetry trace tests
        run: bash tests/telemetry-trace.sh

      - name: Host probe tests
        run: bash tests/host-probes.sh

      - name: Forge release lookup tests
        run: bash tests/forge-release-json.sh

      - name: Install cleanup and uv trap tests
        run: bash tests/install-cleanup.sh
      - name: Console hangup tests
        run: bash tests/console-hangup.sh
      - name: Setup step failure tests
        run: bash tests/setup-step-failures.sh
      - name: pct create settings tests
        run: bash tests/pct-create-settings.sh
      - name: Container removal offer tests
        run: bash tests/container-removal-offer.sh

      - name: Incus restricted project tests
        run: bash tests/incus-restricted-project.sh

      - name: Incus target tests
        run: bash tests/incus-target.sh

      - name: Incus storage space tests
        run: bash tests/incus-storage-space.sh
      - name: Release stamp pending marker tests
        run: bash tests/release-stamp-pending.sh
      - name: pct start reason tests
        run: bash tests/pct-start-reason.sh
      - name: VM silent helper tests
        run: bash tests/vm-silent.sh
      - name: VM failure reason tests
        run: bash tests/vm-failure-reasons.sh
      - name: Verbose silent tests
        run: bash tests/silent-verbose.sh
      - name: VM dialog Esc tests
        run: bash tests/vm-dialog-esc.sh
      - name: MOTD OS version tests
        run: bash tests/motd-os-version.sh
      - name: GitHub release without the API tests
        run: bash tests/github-release-noapi.sh
      - name: Clean install keeps the target until extraction succeeds
        run: bash tests/forge-clean-install.sh
      - name: Screen clear without a terminal tests
        run: bash tests/cs-clear.sh
      - name: App version pin and .deb stamp tests
        run: bash tests/forge-appversion-scope.sh
      - name: GPG key failure reason tests
        run: bash tests/gpg-key-reason.sh
      - name: Clean install from a git branch tests
        run: bash tests/forge-branch-clean-install.sh
      - name: Clean install on Alpine tests
        run: bash tests/alpine-clean-install.sh
      - name: App .vars file tests
        run: bash tests/app-vars-files.sh

      - name: Prefetch lists cover every engine file
        run: |
          set -euo pipefail
          fail=0

          mapfile -t on_disk < <(find $ENGINE_DIRS -name '*.func' -type f | sort)
          mapfile -t listed < <(
            sed -n '/^_CS_ENGINE_FILES=(/,/^)/p' core/build.func |
              tr -s '[:space:]' '\n' | grep -E '\.func$' | sort
          )

          for f in "${on_disk[@]}"; do
            # build.func is the file doing the fetching; it is already loaded.
            [[ "$f" == "core/build.func" ]] && continue
            printf '%s\n' "${listed[@]}" | grep -qxF "$f" || {
              echo "::error file=core/build.func::$f is missing from _CS_ENGINE_FILES"
              fail=1
            }
          done
          for f in "${listed[@]}"; do
            [[ -f "$f" ]] || {
              echo "::error file=core/build.func::_CS_ENGINE_FILES lists $f, which does not exist"
              fail=1
            }
          done

          # install.func fetches the subset a container needs.
          mapfile -t ct_listed < <(
            sed -n '/^_CS_CT_ENGINE_FILES=(/,/^)/p' lxc/install.func |
              tr -s '[:space:]' '\n' | grep -E '\.func$' | sort
          )
          for f in "${ct_listed[@]}"; do
            [[ -f "$f" ]] || {
              echo "::error file=lxc/install.func::_CS_CT_ENGINE_FILES lists $f, which does not exist"
              fail=1
            }
          done
          for f in lib/*.func; do
            printf '%s\n' "${ct_listed[@]}" | grep -qxF "$f" || {
              echo "::error file=lxc/install.func::$f is missing from _CS_CT_ENGINE_FILES"
              fail=1
            }
          done

          echo "engine: ${#listed[@]} of ${#on_disk[@]} listed, container: ${#ct_listed[@]}"
          exit $fail

      - name: Each loader still defines its whole API
        run: |
          set -euo pipefail
          check() {
            local loader="$1" snapshot="$2"
            bash -c '
              COMMUNITY_SCRIPTS_CORE_DIR="$PWD"
              _cs_source_func() { source "$COMMUNITY_SCRIPTS_CORE_DIR/$1"; }
              source "'"$loader"'" >/dev/null 2>&1
              declare -F | awk "{print \$3}" |
                grep -vE "^(_cs_source_func|_tools_source_part|_build_ui_source|_api_source_part)$" | sort
            ' > /tmp/actual.txt
            if ! diff -u "$snapshot" /tmp/actual.txt; then
              echo "::error::$loader exports a different set of functions."
              echo "Intentional? Regenerate $snapshot in the same PR."
              return 1
            fi
            echo "$loader: $(wc -l < /tmp/actual.txt) functions, unchanged"
          }
          fail=0
          check lib/tools.func    lib/API.txt    || fail=1
          check ui/build-ui.func  ui/API.txt     || fail=1
          check api/api.func      api/API.txt    || fail=1
          exit $fail
      - name: Every var_* the engine reads is classified
        # An app's own .vars file may set any var_* outside VAR_RESERVED, so each
        # one the engine reads has to be placed: VAR_WHITELIST (validated),
        # VAR_RESERVED (never from a file), VAR_PER_RUN (never saved from a run)
        # or FILE_OK (harmless unvalidated).
        run: |
          set -euo pipefail
          FILE_OK="var_docker_lxcfs var_extra_disk var_extra_disk_path var_profile var_ssh_import_glob"
          LOCALS="var_key var_val"
          listed=" $(sed -n '/^declare -ag VAR_\(WHITELIST\|RESERVED\|PER_RUN\)=(/,/^)/p' ui/defaults.func | grep -oE '\bvar_[a-z0-9_]+' | tr '\n' ' ') $FILE_OK $LOCALS "
          fail=0
          for v in $(grep -rhoE '\$\{?!?#?var_[a-z0-9_]+' $ENGINE_DIRS --include='*.func' | grep -oE 'var_[a-z0-9_]+' | sort -u); do
            [[ "$listed" == *" $v "* ]] && continue
            echo "::error file=ui/defaults.func::$v is read by the engine but in neither VAR_WHITELIST, VAR_RESERVED nor FILE_OK"
            fail=1
          done
          exit $fail

      - name: Update mode prompt tests
        run: bash tests/update-mode-prompt.sh
